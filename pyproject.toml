[project]
name = "aibackend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "ngkaiwen7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "alembic>=1.20.0",
    "apache-age-python>=0.0.7",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "bitsandbytes>=0.50.2",
    "diffusers>=0.41.0",
    "docstring-parser>=0.18.0",
    "faiss-gpu>=1.15.1",
    "fastapi>=0.143.0",
    "flagembedding>=1.4.2",
    "gguf>=0.19.0",
    "gliner>=0.2.29",
    "huggingface-hub>=1.33.0",
    "json-repair>=0.63.5",
    "langchain-ollama>=1.1.0",
    "llmgraphtransformer>=0.0.2",
    "nltk>=3.10.4",
    "ollama>=0.6.3",
    "omegaconf>=2.4.0",
    "onnxruntime-gpu>=1.31.0",
    "optimum-quanto>=0.2.7",
    "pgvector>=0.5.1",
    "playwright>=1.64.0",
    "protobuf>=7.36.2",
    "psycopg2>=2.9.13",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "sdnq>=0.2.8",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.16",
    "sqlalchemy[asyncio]>=2.1.4",
    "tiktoken>=0.14.0",
    "timm>=1.0.30",
    "uvicorn>=0.54.0",
]

[project.scripts]
aibackend = "aibackend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "LLaDA-Image",
]
